name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── Cross-platform build + test matrix ──
  # Proves the library builds and its tests pass on Linux (gcc & clang),
  # Windows (MSVC), and macOS (clang) — one uniform Ninja + Conan-preset flow.
  build:
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          - { name: linux-gcc,    os: ubuntu-24.04,  cc: gcc-13, cxx: g++-13 }
          - { name: linux-clang,  os: ubuntu-24.04,  cc: clang,  cxx: clang++ }
          - { name: macos-clang,  os: macos-14,      cc: clang,  cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set compiler env (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          pip install "conan>=2.0"
          conan profile detect --force

      - name: Build + test
        run: |
          BT="${{ matrix.build_type }}"
          PRESET="conan-$(echo "$BT" | tr '[:upper:]' '[:lower:]')"
          conan install . --build=missing -s compiler.cppstd=20 -s build_type="$BT" \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET" --output-on-failure

  # ── Sanitizer builds (clang/Linux): ASan+UBSan and TSan ──
  sanitizers:
    name: sanitize / ${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: ["address,undefined", "thread"]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          pip install "conan>=2.0"
          conan profile detect --force
      - name: Build + test with sanitizers
        run: |
          conan install . --build=missing -s compiler.cppstd=20 -s build_type=Debug \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-debug -DBROKER_EXEC_SANITIZER="${{ matrix.san }}"
          cmake --build --preset conan-debug
          ctest --preset conan-debug --output-on-failure

  # ── Format + static analysis ──
  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    # A lint job that cannot converge must fail in minutes, not burn the 6-hour
    # default. clang-tidy over this tree is single-digit minutes once it runs in
    # parallel and skips the Catch2-heavy test TUs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-18 ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sources are all tracked / add_subdirectory resolves
        run: bash scripts/check-sources-tracked.sh

      # clang-format's output is NOT stable across major versions, so an
      # apt-installed formatter makes the gate depend on the runner image: a
      # correctly-formatted tree can fail, and a green CI can turn red with no
      # commit at all. Pin the exact version (the PyPI wheel ships an identical
      # binary on Linux/macOS/Windows) so this check and a developer's local run
      # are byte-for-byte the same tool. Keep in step with docs/conventions.md.
      - name: clang-format check (pinned)
        run: |
          pip install "clang-format==17.0.6"
          clang-format --version
          mapfile -t files < <(find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null)
          if [ ${#files[@]} -gt 0 ]; then clang-format --dry-run --Werror "${files[@]}"; fi
      - name: Generate compile_commands.json
        env:
          CC: clang
          CXX: clang++
        run: |
          pip install "conan>=2.0"
          conan profile detect --force
          conan install . --build=missing -s compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-release
      # PRODUCTION SOURCES ONLY, AND IN PARALLEL. This step used to invoke the
      # single-file driver serially over all 158 translation units, test files
      # included. A Catch2-heavy test TU is where the six-figure warning counts
      # came from, and the whole step ran for over 50 minutes without finishing.
      # The version is pinned for the same reason clang-format is: an apt default
      # that moves with the runner image can turn a gate red with no commit. (#47)
      - name: clang-tidy (pinned, production sources, parallel)
        run: |
          BUILD_DIR="$(dirname "$(find . -name compile_commands.json | head -n1)")"
          COUNT="$(find src -type f -name '*.cpp' ! -name '*_test.cpp' | wc -l)"
          echo "analysing $COUNT production translation units with $(clang-tidy-18 --version | head -n1)"
          find src -type f -name '*.cpp' ! -name '*_test.cpp' -print0 |
            xargs -0 -r -n1 -P "$(nproc)" clang-tidy-18 --quiet -p "$BUILD_DIR"
